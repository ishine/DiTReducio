[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ditreducio"
version = "0.1.0"
description = "Unified calibration and inference bridge for DiTReducio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
ditreducio-calibrate = "ditreducio.cli.calibrate:main"
ditreducio-infer = "ditreducio.cli.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
