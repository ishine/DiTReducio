backend: megatts3

paths:
  backend_code_root: /abs/path/to/MegaTTS3
  backend_ckpt_root: /abs/path/to/MegaTTS3/checkpoints
  calibration_audio_root: /abs/path/to/calibration_audio
  strategy_output_root: /abs/path/to/DiTReducio/outputs/strategies
  inference_output_root: /abs/path/to/DiTReducio/outputs/audio

runtime:
  device: cuda
  dtype: bfloat16
  seed: 888

inference:
  nfe_step: 32
  cfg_strength: 2.0
  sway_sampling_coef: -1.0
  speed: 1.0
  p_w: 1.6
  t_w: 2.5

calibration:
  delta: 0.4
  enable_precheck: true
  enable_precalibration: true
  top_ratio: 0.1

method:
  enable_ts: true
  enable_bs: true
  enable_ws: true
  bs_mode: residual

megatts3:
  input_wav: /abs/path/to/calibration_audio/prompt.wav
  input_text: This is a mega tts calibration sentence.
